id: condition-evaluator-signature
severity: error
message: "Condition evaluators must have signature (state, condition, context?) => boolean"
language: TypeScript
note: "Ensures all condition evaluators follow the runtime contract"
rule:
  pattern: |
    const $NAME = ($STATE, $CONDITION) => {
      $$$BODY
    }
  not:
    pattern: |
      const $NAME = ($STATE, $CONDITION, $CONTEXT?) => boolean
