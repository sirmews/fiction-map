name: Fiction Map Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build

      - name: Run test suite
        run: bun test

      - name: Check generated artifacts are current
        working-directory: apps/literature-rpg
        run: bun run generate --check

      - name: Validate generated metadata
        working-directory: apps/literature-rpg
        run: bun run validate
