name: Fiction Map Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Set up Rust
        run: rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v1.64.8/install.sh | \
            sh -s -- -b "$(go env GOPATH)/bin" v1.64.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run validation checks
        env:
          RUSTUP_TOOLCHAIN: 1.93.0
        run: |
          bun run build
          bun run check
          bun run lint:boundaries
          bun run typecheck
          bun test

          (cd packages/protocol && bun run generate --check)
          bun run packages/runtime/conformance/generate.ts --check
          cargo +1.93.0 test --locked --manifest-path packages/runtime-rs/Cargo.toml
          bun run packages/runtime/conformance/compare.ts
          bun run packages/runtime/conformance/cutover/contract.ts

          (cd apps/literature-rpg && (bun run generate --check || (cp .fiction-map/metadata.json /tmp/old-metadata.json && cp SEMANTICS.md /tmp/old-semantics.md && bun run generate && diff -u /tmp/old-metadata.json .fiction-map/metadata.json && diff -u /tmp/old-semantics.md SEMANTICS.md && exit 1)))
          (cd apps/literature-rpg && bun run validate)
          (cd apps/literature-rpg-tui && go test -v ./...)
          (cd packages/protocol/go && go test -v ./...)
          (cd apps/literature-rpg-tui && golangci-lint run --timeout 5m ./...)
          (cd packages/protocol/go && golangci-lint run --timeout 5m ./...)

      - name: Verify the Rust runtime in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/fiction-map-playwright" --no-audit --no-fund playwright@1.59.1
          "$RUNNER_TEMP/fiction-map-playwright/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fiction-map-playwright/node_modules/playwright/index.mjs" bun run packages/runtime/conformance/cutover/browser.ts
