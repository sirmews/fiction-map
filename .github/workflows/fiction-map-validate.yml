name: Fiction Map Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build

      - name: Run Biome linter
        run: bun run lint

      - name: Run UI boundary guardrails
        run: bun run lint:boundaries

      - name: Run TypeScript typecheck
        run: bun run typecheck

      - name: Run test suite
        run: bun test

      - name: Run Go tests
        run: |
          for module_dir in "apps/literature-rpg-tui" "packages/protocol/go"; do
            echo "Running go test in ${module_dir}"
            (cd "${module_dir}" && go test -v ./...)
          done

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: apps/literature-rpg-tui
          install-mode: go

      - name: Run golangci-lint (protocol)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: packages/protocol/go
          install-mode: go

      - name: Check generated protocol bindings are current
        working-directory: packages/protocol
        run: bun run generate --check

      - name: Check generated artifacts are current
        working-directory: apps/literature-rpg
        run: bun run generate --check

      - name: Validate generated metadata
        working-directory: apps/literature-rpg
        run: bun run validate
