name: Fiction Map Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v1.64.8/install.sh | \
            sh -s -- -b "$(go env GOPATH)/bin" v1.64.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run validation checks
        run: |
          bun run build
          bun run check
          bun run lint:boundaries
          bun run typecheck
          bun test

          (cd packages/protocol && bun run generate --check)

          (cd apps/literature-rpg && (bun run generate --check || (cp .fiction-map/metadata.json /tmp/old-metadata.json && cp SEMANTICS.md /tmp/old-semantics.md && bun run generate && diff -u /tmp/old-metadata.json .fiction-map/metadata.json && diff -u /tmp/old-semantics.md SEMANTICS.md && exit 1)))
          (cd apps/literature-rpg && bun run validate)
          (cd apps/literature-rpg-tui && go test -v ./...)
          (cd packages/protocol/go && go test -v ./...)
          (cd apps/literature-rpg-tui && golangci-lint run --timeout 5m ./...)
          (cd packages/protocol/go && golangci-lint run --timeout 5m ./...)
