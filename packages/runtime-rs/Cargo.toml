[package]
name = "fiction-map-runtime"
version = "0.1.0"
edition = "2024"
description = "Rust port of the fiction-map runtime path enumeration engine"
license = "MIT"

[lib]
name = "fiction_map_runtime"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ahash = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
walkdir = "2"

[[bench]]
name = "enumerate_paths"
harness = false
